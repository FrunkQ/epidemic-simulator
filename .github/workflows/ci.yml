name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A new push to a pull request cancels its older run. Each push to main gets a group of its own
# (by commit), so no run on main waits behind another or is cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      - name: The layout probe stays out of the deployed build
        run: '! grep -rq __layoutProbe build'
  # The suite runs in three parts at once, so each job stays inside the 5-minute budget (10 Oct).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --shard=${{ matrix.shard }}/3
  # The card layout in a real browser (10): a build with the layout probe, Playwright's own
  # Chromium (pinned with @playwright/test, so a runner image update can't change it).
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  # One result to require on main: green only when lint, every test shard and the browser checks passed.
  check:
    runs-on: ubuntu-latest
    needs: [lint, test, browser]
    if: always()
    steps:
      - name: Every job passed
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "lint: $LINT, test: $TEST, browser: $BROWSER"
          test "$LINT" = success && test "$TEST" = success && test "$BROWSER" = success
